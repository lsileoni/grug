name: benchmark

# Self-contained Elo benchmark of the PR's engine against its past self (the
# base branch, "main"). Builds both commits, plays them head-to-head with
# fastchess at a fixed node time control, and computes an Elo rating with a
# 95% confidence interval. The job is a MERGE BLOCKER, but only fails on a
# statistically significant *regression* (or an engine crash) -- a neutral or
# positive result passes, since the engine playing itself is expected to be ~0.
#
# HYBRID: when BENCH_URL + BENCH_TOKEN secrets are configured, it ALSO kicks off
# the richer SPRT run on the external Grug Bench server (non-blocking, for the
# dashboard). Without those secrets the self-contained match is the source of
# truth.
#
# Path-gated: only runs the match when engine source / build files change. The
# job still ALWAYS reports a conclusion so it is a safe required status check.

on:
  pull_request:
    branches: [main]

concurrency:
  group: bench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  # Match size and time control. nodes-based TC is deterministic and runner-
  # independent, which is exactly what the engine supports via UCI `go nodes`.
  TC: "nodes=200000"
  ROUNDS: "200" # 200 paired games = 400 games total
  CONCURRENCY: "2"
  REGRESSION_GUARD_ELO: "-10" # fail only if PR is clearly below this

jobs:
  changes:
    if: >-
      vars.CI_SKIP_ACTOR == '' ||
      (github.actor != vars.CI_SKIP_ACTOR &&
       github.event.pull_request.user.login != vars.CI_SKIP_ACTOR)
    runs-on: ubuntu-latest
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            source:
              - 'src/**'
              - 'Makefile'
              - 'CMakeLists.txt'
              - 'build.ps1'

  benchmark:
    if: >-
      vars.CI_SKIP_ACTOR == '' ||
      (github.actor != vars.CI_SKIP_ACTOR &&
       github.event.pull_request.user.login != vars.CI_SKIP_ACTOR)
    needs: changes
    runs-on: ubuntu-latest
    # Reject fork PRs early: building/running an untrusted head commit and
    # posting PR comments requires same-repo provenance.
    timeout-minutes: 120
    # Expose bench-server secrets as job env so step `if:` conditions can test
    # whether the optional hybrid SPRT path is configured (secrets.* is not
    # allowed directly inside an `if:` expression).
    env:
      BENCH_URL: ${{ secrets.BENCH_URL }}
      BENCH_TOKEN: ${{ secrets.BENCH_TOKEN }}
    steps:
      - name: Skip (no source changes)
        if: needs.changes.outputs.source != 'true'
        run: echo "No engine source changed; benchmark not required for this PR."

      - name: Reject fork PRs
        if: >-
          needs.changes.outputs.source == 'true' &&
          github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::Benchmark gating runs on same-repo branches only."
          echo "Run a manual benchmark for fork PRs before merging."
          exit 1

      - name: Checkout (full history for base build)
        if: needs.changes.outputs.source == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install toolchain + fastchess
        if: needs.changes.outputs.source == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gcc make git
          # Build fastchess from source pinned to a tag for reproducibility.
          # Keep this ref in sync with .devcontainer/Dockerfile (FASTCHESS_REF).
          git clone --depth 1 --branch v1.8.1-alpha https://github.com/Disservin/fastchess.git /tmp/fastchess
          make -C /tmp/fastchess -j"$(nproc)"
          sudo install -m755 /tmp/fastchess/fastchess /usr/local/bin/fastchess
          fastchess --version

      - name: Detect modified algorithm
        if: needs.changes.outputs.source == 'true'
        id: algo
        # Determine the benchmark targets:
        #   - default when shared engine/build code changed
        #   - each specifically modified algorithm
        # This catches mixed PRs, e.g. shared helpers plus square_maximization.
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          mapfile -t all_changed < <(
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
              'src/**' 'Makefile' 'CMakeLists.txt' 'build.ps1' || true
          )
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'src/algorithms/*.[ch]' || true)

          shared_changed=false
          for f in "${all_changed[@]}"; do
            case "$f" in
              src/algorithms/*.[ch]) ;;
              *) shared_changed=true ;;
            esac
          done

          targets=()
          if [ "$shared_changed" = "true" ]; then
            targets+=("default")
            echo "Shared engine/build files changed; benchmarking default algorithm."
          fi

          unique=()
          if [ "${#changed[@]}" -gt 0 ]; then
            names=()
            for f in "${changed[@]}"; do
              case "$f" in
                *.h) source="${f%.h}.c" ;;
                *) source="$f" ;;
              esac
              [ -f "$source" ] || continue

              # Prefer the designated initializer used by current algorithms,
              # but keep the positional form supported for older examples.
              name="$(
                grep -ozP '\.name\s*=\s*"[^"]+"' "$source" \
                  | tr '\0' '\n' | grep -oE '"[^"]+"' | head -1 | tr -d '"' || true
              )"
              if [ -z "$name" ]; then
                name="$(
                  grep -ozP 'const\s+Algorithm\s+\w+\s*=\s*\{\s*"[^"]+"' "$source" \
                    | tr '\0' '\n' | grep -oE '"[^"]+"' | tail -1 | tr -d '"' || true
                )"
              fi

              if [ -n "$name" ]; then
                names+=("$name")
                echo "Modified algorithm file: $f -> '$name'"
              else
                echo "::warning::Could not determine algorithm name from $source"
              fi
            done

            unique=()
            if [ "${#names[@]}" -gt 0 ]; then
              mapfile -t unique < <(printf '%s\n' "${names[@]}" | sort -u)
            fi
            if [ "${#unique[@]}" -eq 0 ]; then
              echo "::warning::Algorithm-specific files changed, but no algorithm name was detected; using engine default."
            fi
          elif [ "$shared_changed" != "true" ]; then
            echo "No algorithm-specific or shared engine files changed; using engine default algorithm."
          fi

          for name in "${unique[@]}"; do
            targets+=("$name")
          done

          mapfile -t targets < <(printf '%s\n' "${targets[@]}" | awk 'NF && !seen[$0]++')
          if [ "${#targets[@]}" -eq 0 ]; then
            targets+=("default")
          fi

          algos="$(IFS=,; echo "${targets[*]}")"
          echo "Benchmark algorithms: $algos"
          echo "algo=$algos" >> "$GITHUB_OUTPUT"
          echo "algos=$algos" >> "$GITHUB_OUTPUT"

      - name: Build PR (dev) engine
        if: needs.changes.outputs.source == 'true'
        run: |
          set -euo pipefail
          # ARCH= keeps the build portable across runner CPUs.
          make GRUG_IN_CONTAINER=1 native ARCH= EXE=build/grug-dev
          test -x build/grug-dev

      - name: Build base (main) engine
        if: needs.changes.outputs.source == 'true'
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git worktree add /tmp/base "$BASE_SHA"
          make -C /tmp/base GRUG_IN_CONTAINER=1 native ARCH= EXE=build/grug-base
          cp /tmp/base/build/grug-base build/grug-base
          test -x build/grug-base

      - name: Write opening book
        if: needs.changes.outputs.source == 'true'
        # A small, balanced EPD book so the self-match isn't 400 identical games.
        run: |
          cat > /tmp/book.epd <<'EOF'
          rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1
          rnbqkbnr/pppp1ppp/8/4p3/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
          rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
          rnbqkbnr/ppp1pppp/8/3p4/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 0 2
          rnbqkbnr/pppppppp/8/8/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 1
          rnbqkbnr/pp1ppppp/8/2p5/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2
          rnbqkb1r/pppppppp/5n2/8/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 1 2
          rnbqkbnr/ppp1pppp/8/3p4/3P4/8/PPP1PPPP/RNBQKBNR w KQkq - 0 2
          rnbqkb1r/pppppppp/5n2/8/4P3/8/PPPP1PPP/RNBQKBNR w KQkq - 1 2
          rnbqkbnr/pppp1ppp/8/4p3/8/5N2/PPPPPPPP/RNBQKB1R b KQkq - 1 1
          EOF

      - name: Run match (dev vs base)
        if: needs.changes.outputs.source == 'true'
        id: match
        run: |
          set -euo pipefail
          IFS=, read -r -a ALGOS <<< "${{ steps.algo.outputs.algos }}"
          : > /tmp/bench-results.ndjson
          crashed_any=false

          for ALGO in "${ALGOS[@]}"; do
            safe="$(printf '%s' "$ALGO" | tr -c 'A-Za-z0-9_.-' '_')"
            pgn="/tmp/games-${safe}.pgn"
            log="/tmp/match-${safe}.log"

            OPT=()
            if [ "$ALGO" != "default" ]; then
              OPT=("option.Algorithm=$ALGO")
            fi

            echo "::group::fastchess $ALGO"
            set +e
            fastchess \
              -engine name=dev cmd=build/grug-dev proto=uci "${OPT[@]}" \
              -engine name=base cmd=build/grug-base proto=uci "${OPT[@]}" \
              -each "$TC" \
              -openings file=/tmp/book.epd format=epd order=random \
              -games 2 -rounds "$ROUNDS" -repeat \
              -concurrency "$CONCURRENCY" \
              -draw movenumber=40 movecount=8 score=10 \
              -resign movecount=4 score=600 twosided=true \
              -recover \
              -pgnout file="$pgn" | tee "$log"
            rc=$?
            set -e
            echo "::endgroup::"

            # A nonzero rc with no PGN means the harness itself failed.
            if [ "$rc" -ne 0 ] && [ ! -s "$pgn" ]; then
              echo "::error::Match harness failed for $ALGO (rc=$rc) and produced no games."
              exit 1
            fi

            crashed=false
            if grep -Eiq 'disconnect|terminated|stall|illegal' "$log"; then
              crashed=true
              crashed_any=true
            fi

            python3 - "$pgn" "$ALGO" "$crashed" >> /tmp/bench-results.ndjson <<'PY'
          import importlib.util
          import json
          import math
          import sys

          pgn, algo, crashed = sys.argv[1], sys.argv[2], sys.argv[3]
          spec = importlib.util.spec_from_file_location("elo_report", ".github/scripts/elo_report.py")
          elo_report = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(elo_report)

          wins, draws, losses = elo_report.parse_games(pgn, "dev", "base")
          games = wins + draws + losses
          elo, error_bar, los = elo_report.elo_with_ci(wins, draws, losses)
          if not math.isfinite(elo):
              elo = 0.0
          if not math.isfinite(error_bar):
              error_bar = 0.0
          if not math.isfinite(los):
              los = 0.0
          print(json.dumps({
              "algorithm": algo,
              "games": games,
              "wins": wins,
              "draws": draws,
              "losses": losses,
              "elo": round(elo, 1),
              "error_bar": round(error_bar, 1),
              "los": round(los * 100.0, 1),
              "crashed": crashed == "true",
          }, separators=(",", ":")))
          PY
          done

          results="$(python3 - <<'PY'
          import json
          with open("/tmp/bench-results.ndjson", "r", encoding="utf-8") as fh:
              rows = [json.loads(line) for line in fh if line.strip()]
          print(json.dumps(rows, separators=(",", ":")))
          PY
          )"

          echo "results_json=$results" >> "$GITHUB_OUTPUT"
          echo "crashed=$crashed_any" >> "$GITHUB_OUTPUT"

      - name: Optional SPRT on external bench server (non-blocking)
        if: >-
          needs.changes.outputs.source == 'true' &&
          env.BENCH_URL != '' && env.BENCH_TOKEN != ''
        continue-on-error: true
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          ALGOS: ${{ steps.algo.outputs.algos }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          URL = os.environ["BENCH_URL"].rstrip("/")
          TOKEN = os.environ["BENCH_TOKEN"]

          def call(path, body=None):
              req = urllib.request.Request(
                  URL + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  headers={"Authorization": "Bearer " + TOKEN,
                           "Content-Type": "application/json"})
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return json.load(resp)

          created = []
          for algo in [a for a in os.environ.get("ALGOS", "default").split(",") if a]:
              body = {
                  "engine": "grug", "type": "sprt",
                  "dev_ref": os.environ["SHA"], "base_ref": "main",
                  "elo0": -5, "elo1": 0, "tc": "nodes=200000", "max_pairs": 4000,
              }
              if algo != "default":
                  body["dev_algorithm"] = algo
                  body["base_algorithm"] = algo
              tid = call("/api/tests", body)["id"]
              created.append((algo, tid))
              print(f"SPRT dashboard ({algo}) -> {URL}/test/{tid}", flush=True)

          # Informational only: poll briefly, then leave tests running server-side.
          for _ in range(8):
              done = True
              for algo, tid in created:
                  t = call("/api/ci/test/%d" % tid)
                  print("%s: games=%d LLR=%+.2f elo=%+.1f %s %s" % (
                      algo, t["games"], t["llr"], t["elo"], t["status"], t["result"]), flush=True)
                  if t["status"] not in ("finished", "stopped", "failed"):
                      done = False
              if done:
                  break
              time.sleep(15)
          PY

      - name: Comment results on PR
        if: needs.changes.outputs.source == 'true' && always()
        continue-on-error: true
        env:
          RESULTS_JSON: ${{ steps.match.outputs.results_json }}
        uses: actions/github-script@v7
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS_JSON || '[]');
            const rows = results.length
              ? results.map(r => {
                  const elo = Number(r.elo).toFixed(1);
                  const eb = Number(r.error_bar).toFixed(1);
                  const los = Number(r.los).toFixed(1);
                  return `| \`${r.algorithm}\` | ${r.games} (W:${r.wins} D:${r.draws} L:${r.losses}) | **${elo} ± ${eb}** | ${los}% | ${r.crashed} |`;
                })
              : ['| n/a | 0 | n/a | n/a | n/a |'];
            const body = [
              `### Benchmark: PR engine vs \`main\` (past self)`,
              ``,
              `| Algorithm | Games | Elo (95% CI) | LOS (PR stronger) | Crash |`,
              `| --- | --- | --- | --- | --- |`,
              ...rows,
              ``,
              `_Self-contained fastchess match at \`${process.env.TC || 'nodes=200000'}\`._`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- grug-benchmark -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const prev = comments.data.find(c => c.body && c.body.includes(marker));
            const full = body + '\n' + marker;
            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body: full });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: full });
            }

      - name: Gate on regression / crash
        if: needs.changes.outputs.source == 'true'
        env:
          RESULTS_JSON: ${{ steps.match.outputs.results_json }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          guard = float(os.environ["REGRESSION_GUARD_ELO"])
          results = json.loads(os.environ.get("RESULTS_JSON") or "[]")
          if not results:
              print("::error::No benchmark results were produced.")
              sys.exit(1)

          failed = False
          for r in results:
              algo = r["algorithm"]
              elo = float(r["elo"])
              error_bar = float(r["error_bar"])
              games = int(r["games"])
              crashed = bool(r["crashed"])
              upper = elo + error_bar

              print(f"{algo}: Elo={elo:+.1f} +/- {error_bar:.1f} over {games} games (crashed={crashed})")

              if crashed:
                  print(f"::error::{algo}: engine crash / illegal move detected during the match.")
                  failed = True
              if games == 0:
                  print(f"::error::{algo}: no completed games were produced.")
                  failed = True
              # Fail only on a statistically significant regression: the upper bound
              # of the 95% CI (Elo + error_bar) is still below the guard threshold.
              if upper < guard:
                  print(f"::error::{algo}: significant regression: CI upper bound {upper:+.1f} Elo < {guard:+.1f} Elo.")
                  failed = True

          if failed:
              sys.exit(1)
          print("No significant regression. Benchmark gate passed.")
          PY
